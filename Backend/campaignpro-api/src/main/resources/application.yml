server:
  port: 8080

spring:
  application:
    name: campaignpro-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://dpg-da46pg0jo6nc73dpt74g-a.oregon-postgres.render.com/campaignpro}
    username: ${DB_USERNAME:campaignpro_user}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: when-authorized

  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-must-be-at-least-32-bytes-long}
    access-token-expiration-minutes: ${JWT_ACCESS_EXP_MIN:60}
    refresh-token-expiration-days: ${JWT_REFRESH_EXP_DAYS:7}

  mail:
    from: ${MAIL_FROM:no-reply@campaignpro.io}
    provider: ${MAIL_PROVIDER:smtp}

  tracking:
    base-url: ${TRACKING_BASE_URL:http://localhost:8080}
    token-secret: ${TRACKING_TOKEN_SECRET:dev-only-tracking-secret-change-me-32bytes}

  campaign:
    send-batch-size: ${CAMPAIGN_BATCH_SIZE:100}
    max-retries: ${CAMPAIGN_MAX_RETRIES:3}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    com.campaignpro: DEBUG
    org.hibernate.SQL: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"